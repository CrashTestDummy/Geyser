name: Build & Release

on:
  push:
    branches:
      - feature/splitscreen-guest-support
  workflow_run:
    workflows: ["Auto Rebase from Upstream"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Feature Branch
        uses: actions/checkout@v4
        with:
          ref: feature/splitscreen-guest-support
          submodules: true

      - name: Get Feature Branch SHA
        id: feature-sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Geyser
        run: ./gradlew build

      - name: Parse Version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP 'version=\K[0-9A-Za-z.\-]+' gradle.properties)
          if [ -z "$version" ]; then
            echo "::error::Failed to parse version from gradle.properties"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "TAG=splitscreen-${version}" >> "$GITHUB_OUTPUT"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Splitscreen ${{ steps.version.outputs.VERSION }}"
          body: |
            Automated build of split screen guest support.
            Based on upstream GeyserMC/Geyser master + split screen commit.
            Built from: ${{ steps.feature-sha.outputs.SHA }}
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            bootstrap/mod/fabric/build/libs/Geyser-Fabric.jar
            bootstrap/mod/neoforge/build/libs/Geyser-NeoForge.jar
            bootstrap/standalone/build/libs/Geyser-Standalone.jar
            bootstrap/spigot/build/libs/Geyser-Spigot.jar
            bootstrap/bungeecord/build/libs/Geyser-BungeeCord.jar
            bootstrap/velocity/build/libs/Geyser-Velocity.jar
            bootstrap/viaproxy/build/libs/Geyser-ViaProxy.jar
